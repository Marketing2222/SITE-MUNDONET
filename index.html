    <meta property="og:site_name" content="Mundonet Telecom" />
    <meta property="og:title" content="Mundonet Telecom" />
    <meta property="og:description" content="A melhor internet da Área Itaqui Bacanga. Assine a Mundonet e tenha acesso a aplicativos, canais de TV e muito mais!" />
    <style>
      body {
        margin: 0;
        background-color: #f5f5f5;
      }
      #root {
        opacity: 0;
        visibility: hidden;
      }
      #root.loaded {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        gap: 24px;
      }
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
      #loading-mascot-area {
        width: 140px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #loading-mascot-area img {
        width: 140px;
        height: 140px;
        object-fit: contain;
        animation: loadingPulse 1.5s ease-in-out infinite;
      }
      #loading-mascot-area svg {
        animation: loadingSpin 1.2s linear infinite;
      }
      @keyframes loadingSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes loadingPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      .loading-dots {
        display: flex;
        gap: 8px;
      }
      .loading-dot {
        width: 10px;
        height: 10px;
        background: #005CFF;
        border-radius: 50%;
        animation: loadingDotBounce 1.4s ease-in-out infinite;
      }
      .loading-dot:nth-child(2) { animation-delay: 0.2s; }
      .loading-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes loadingDotBounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
    </style>

  <body>
    <div id="loading-screen">
      <div id="loading-mascot-area"></div>
      <div class="loading-dots">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Busca o mascote configurado e insere na tela de loading
      fetch('/api/settings').then(function(r) { return r.json(); }).then(function(data) {
        var area = document.getElementById('loading-mascot-area');
        if (!area) return;
        var url = data.loading_mascot_url && data.loading_mascot_url.value;
        if (url) {
          var img = new Image();
          img.src = url;
          img.alt = 'Mascote';
          img.className = 'loading-mascot-img';
          img.onload = function() { area.appendChild(img); };
          // Fallback: se a imagem nao carregar em 2s, mostra o M
          setTimeout(function() {
            if (!area.querySelector('img')) {
              area.innerHTML = '<svg viewBox="0 0 200 200" width="120" height="120"><circle cx="100" cy="100" r="80" fill="none" stroke="#e0e0e0" stroke-width="8" /><circle cx="100" cy="100" r="80" fill="none" stroke="#005CFF" stroke-width="8" stroke-dasharray="120 380" stroke-linecap="round" /><text x="100" y="110" text-anchor="middle" font-size="40" font-weight="bold" fill="#005CFF">M</text></svg>';
            }
          }, 2000);
        } else {
          // Sem mascote: mostra o M animado
          area.innerHTML = '<svg viewBox="0 0 200 200" width="120" height="120"><circle cx="100" cy="100" r="80" fill="none" stroke="#e0e0e0" stroke-width="8" /><circle cx="100" cy="100" r="80" fill="none" stroke="#005CFF" stroke-width="8" stroke-dasharray="120 380" stroke-linecap="round" /><text x="100" y="110" text-anchor="middle" font-size="40" font-weight="bold" fill="#005CFF">M</text></svg>';
        }
      }).catch(function() {
        // Erro: mostra o M
        var area = document.getElementById('loading-mascot-area');
        if (area) {
          area.innerHTML = '<svg viewBox="0 0 200 200" width="120" height="120"><circle cx="100" cy="100" r="80" fill="none" stroke="#e0e0e0" stroke-width="8" /><circle cx="100" cy="100" r="80" fill="none" stroke="#005CFF" stroke-width="8" stroke-dasharray="120 380" stroke-linecap="round" /><text x="100" y="110" text-anchor="middle" font-size="40" font-weight="bold" fill="#005CFF">M</text></svg>';
        }
      });
    </script>
  </body>
